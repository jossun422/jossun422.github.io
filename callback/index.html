<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>授權完成</title>
<body style="font-family:sans-serif;padding:24px;max-width:600px;margin:auto">
<h2 id="h">授權完成</h2>
<p id="m">請長按下方代碼全選並複製，再回到聊天中填入安全欄位。</p>
<textarea id="c" readonly style="width:100%;height:120px;font-size:16px"></textarea>
<script>
var p=new URLSearchParams(location.search);var c=p.get('code');
if(c){document.getElementById('c').value=c;}else{document.getElementById('h').textContent='沒有收到授權碼';document.getElementById('m').textContent=p.get('error_description')||p.get('error')||'請重新授權一次。';}
</script></body>
